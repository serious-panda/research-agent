services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./qdrant_storage:/qdrant/storage:z"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -ne \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && read -t 2 line <&3 && echo $$line | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build: { context: apps/mcp-server }
    ports: ["8000:8000"]
    volumes: ["./reports:/app/reports"]
    environment:
      REPORTS_DIR: /app/reports
      MCP_PORT: "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-api:
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
    ports: ["8001:8001"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      MCP_SERVER_URL: http://mcp-server:8000/sse
      MAX_ITERATIONS: ${MAX_ITERATIONS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:   { condition: service_healthy }
      qdrant:     { condition: service_healthy }
      mcp-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer-web:
    build: { context: apps/consumer-web }
    ports: ["3000:80"]
    depends_on:
      agent-api: { condition: service_healthy }

  backoffice:
    build: { context: apps/backoffice }
    ports: ["3001:80"]
