[tool.poetry]
name = "agent-api"
version = "0.1.0"
description = "Research agent API service"
authors = []
packages = [{ include = "agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
rag-pipeline = { path = "../../packages/rag", develop = true }
langgraph = "1.1.3"
langgraph-checkpoint-postgres = "3.0.5"
langchain-mcp-adapters = "0.2.2"
langchain-openai = "*"
ddgs = "*"
httpx = "*"
psycopg = { version = "*", extras = ["binary"] }
python-dotenv = "*"
mcp = { version = "*", extras = ["cli"] }
fastapi = ">=0.111"
uvicorn = {extras = ["standard"], version = "^0.42.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
