services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    # No volume — ephemeral by design; data is lost when the container stops.
    # This matches the previous `docker run --rm` behavior.

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ../qdrant_storage:/qdrant/storage:z
    # qdrant_storage/ is gitignored; data persists across container restarts.
